name: Publish router image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: router-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/router/Dockerfile
          platforms: linux/amd64
          load: true
          tags: xiaogpt-router:test
      - name: Run offline checks
        run: |
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -w /repo \
            --entrypoint /app/.venv/bin/python xiaogpt-router:test \
            -m unittest discover -s tests -v
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long
      - name: Publish AMD64 and ARM64 images
        id: publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/router/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Publish source release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v9.0.0
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const notes = fs.readFileSync('CHANGELOG.md', 'utf8');
            const body = notes + '\n\nImage: `ghcr.io/' + context.repo.owner.toLowerCase() + '/' + context.repo.repo.toLowerCase() + ':' + tag + '`\n\nDigest: `' + process.env.IMAGE_DIGEST + '`';
            const params = {...context.repo, tag_name: tag, name: tag, body, draft: false, prerelease: false};
            try {
              const existing = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              await github.rest.repos.updateRelease({...params, release_id: existing.data.id});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease(params);
            }
